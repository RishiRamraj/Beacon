[package]
name = "beacon"
description = "An accessible SNES emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
beacon-emu.workspace = true
beacon-output.workspace = true
beacon-config.workspace = true
beacon-plugin.workspace = true
beacon-mcp.workspace = true
serde_json.workspace = true
winit = "0.30"
softbuffer = "0.4"
cpal = "0.18"
gilrs = "0.11"
accesskit = "0.25.0"
accesskit_winit = "0.34.0"
lewton = "0.10"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "gles", "wgsl"] }
pollster = "1.0.1"


[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
muda = "0.19.3"

[dev-dependencies]
hound = "3"
